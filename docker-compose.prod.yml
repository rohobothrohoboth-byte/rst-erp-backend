services:

  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # RABBITMQ
  # ============================================================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s        # Increased from 10s
      timeout: 30s         # Increased from 5s
      retries: 5           # Reduced from 10
      start_period: 60s    # Add this - give RabbitMQ 60 seconds to initialize

  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:8.6
    container_name: redis_prod
    restart: always
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-kRrwYqqHWnnZpMhnn30way}"
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-kRrwYqqHWnnZpMhnn30way}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth:
    build:
      context: .
      dockerfile: src/Svc.Auth/Dockerfile.prod
    container_name: auth_prod
    restart: unless-stopped
    ports:
      - "7000:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ~/.nuget/packages:/root/.nuget/packages
      - C:\nuget-packages:/root/.nuget/packages
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production

      Redis__ConnectionString: >-
        redis:6379,password=${REDIS_PASSWORD:-kRrwYqqHWnnZpMhnn30way},abortConnect=false
      Redis:ConnectionString: >-
        redis:6379,password=${REDIS_PASSWORD:-kRrwYqqHWnnZpMhnn30way},abortConnect=false

      ConnectionStrings__authMgrCon: >-
        Host=postgres;
        Port=5432;
        Database=Auth.Mgr;
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD:-root}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}

      ServiceUrls__CoreModuleApi: http://core-module
      ServiceUrls__CoreHRMMApi: http://core-hrmm
      ServiceUrls__HRMProApi: http://hrm-profile

