version: '3.8'

services:
  # ============ DATABASES ============
  auth_db:
    image: postgres:15
    container_name: auth_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: Auth.Mgr
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  core_db:
    image: postgres:15
    container_name: core_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: core.Module
    ports:
      - "5433:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  hrm_db:
    image: postgres:15
    container_name: hrm_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: HRM.Pro
    ports:
      - "5434:5432"
    volumes:
      - hrm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_prod
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis_prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core_api:
    build:
      context: .
      dockerfile: src/Svc.Core/Cor.Module/Dockerfile.prod
    container_name: core_api_prod
    restart: unless-stopped
    ports:
      - "1102:80"
    depends_on:
      core_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - core_backup_data:/app/backups
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__CorModuleDbCon=Host=core_db;Port=5432;Database=core.Module;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-root}
      - RabbitMQ__Host=rabbitmq

  core_hrmm_api:
    build:
      context: .
      dockerfile: src/Svc.Core/Cor.HRMM/Dockerfile.prod
    container_name: core_hrmm_api_prod
    restart: unless-stopped
    ports:
      - "1101:80"
    depends_on:
      hrm_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__coreHRMMDbCon=Host=hrm_db;Port=5432;Database=core.HRMM;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-root}
      - RabbitMQ__Host=rabbitmq

  hrm_pro_api:
    build:
      context: .
      dockerfile: src/Svc.HRM/Profile.API/Dockerfile.prod
    container_name: hrm_pro_api_prod
    restart: unless-stopped
    ports:
      - "1215:80"
    depends_on:
      hrm_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__HRMProDbCon=Host=hrm_db;Port=5432;Database=HRM.Pro;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-root}
      - RabbitMQ__Host=rabbitmq

  auth_api:
    build:
      context: .
      dockerfile: src/Svc.Auth/Dockerfile.prod
    container_name: auth_api_prod
    restart: unless-stopped
    ports:
      - "1213:80"
    depends_on:
      auth_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__authMgrCon=Host=auth_db;Port=5432;Database=Auth.Mgr;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-root}
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - ServiceUrls__CoreModuleApi=http://core_api
      - ServiceUrls__CoreHRMMApi=http://core_hrmm_api
      - ServiceUrls__HRMProApi=http://hrm_pro_api

  gateway:
    build:
      context: .
      dockerfile: src/Svc.Gateway/Dockerfile.prod
    container_name: gateway_prod
    restart: unless-stopped
    ports:
      - "1212:80"
    depends_on:
      - auth_api
      - core_api
      - core_hrmm_api
      - hrm_pro_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

volumes:
  auth_db_data:
  core_db_data:
  hrm_db_data:
  core_backup_data:
